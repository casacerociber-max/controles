<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buscador de Controles — Casa Cero</title><style>
*{box-sizing:border-box}body{font:16px system-ui,Arial;margin:0;background:#f4f6f9;color:#16253b}header{background:#152b4b;color:white;padding:24px 5%}header h1{margin:0 0 5px;font-size:1.6rem}header p{margin:0;opacity:.8}main{max-width:1200px;margin:auto;padding:24px 5%}.search{display:flex;gap:8px}input{flex:1;min-width:0;padding:16px;border:2px solid #c9d1dc;border-radius:12px;font-size:22px;text-transform:uppercase}button{border:0;border-radius:12px;padding:10px 17px;background:#1d66ba;color:white;font-size:18px;cursor:pointer}.meta{margin:16px 0;color:#4c596b}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}.card{background:white;border-radius:14px;box-shadow:0 2px 10px #14294a16;padding:12px;text-align:center;cursor:pointer}.card img{width:100%;height:235px;object-fit:contain}.card b{display:block;font-size:18px}.card small{color:#67778d}.modal{display:none;position:fixed;inset:0;background:#071321dc;align-items:center;justify-content:center;padding:18px;z-index:5}.modal.open{display:flex}.dialog{background:white;border-radius:16px;padding:20px;max-width:95vw;max-height:95vh;text-align:center;overflow:auto}.dialog img{max-height:70vh;max-width:80vw}.dialog h2{margin:6px}.close{float:right}.hint{font-size:13px;color:#63718a;margin:12px 0} @media(max-width:500px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card img{height:190px}}
</style></head><body><header><h1>Casa Cero · Buscador de controles</h1><p>Catálogo Grupo Controles · funciona sin Internet</p></header><main><div class="search"><input id="q" placeholder="Ej.: AR-869" autofocus autocomplete="off"><button id="voice" title="Dictar código">🎙️</button><button id="clear" title="Borrar">×</button></div><div class="hint">Buscá por código completo o parcial. Tocá una foto para ampliarla.</div><div class="meta" id="meta"></div><div class="grid" id="grid"></div></main><div class="modal" id="modal"><div class="dialog"><button class="close" id="close">×</button><h2 id="bigcode"></h2><img id="bigimg"><p id="bigpage"></p></div></div><script src="datos.js"></script><script>
const q=document.getElementById('q'),grid=document.getElementById('grid'),meta=document.getElementById('meta');
function normalize(s){return s.toUpperCase().replace(/[^A-Z0-9]/g,'')}
function show(){let query=normalize(q.value);let list=CONTROLES.filter(x=>normalize(x.codigo).includes(query));meta.textContent=list.length+' controles encontrados · '+CONTROLES.length+' imágenes en el catálogo';grid.innerHTML='';for(let x of list.slice(0,180)){let el=document.createElement('article');el.className='card';let img=document.createElement('img');img.src=x.imagen;img.loading='lazy';img.alt=x.codigo;let b=document.createElement('b');b.textContent=x.codigo;let small=document.createElement('small');small.textContent='Página '+x.pagina;el.append(img,b,small);el.onclick=()=>{document.getElementById('bigcode').textContent=x.codigo;document.getElementById('bigimg').src=x.imagen;document.getElementById('bigpage').textContent='Página '+x.pagina+' del PDF';document.getElementById('modal').classList.add('open')};grid.append(el)}if(list.length>180){let p=document.createElement('p');p.textContent='Escribí más caracteres para reducir los resultados.';grid.append(p)}}
q.addEventListener('input',show);document.getElementById('clear').onclick=()=>{q.value='';show();q.focus()};document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.target.classList.remove('open')};
document.getElementById('voice').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){alert('El dictado no está disponible en este navegador sin conexión. Podés escribir el código.');return}let r=new R();r.lang='es-AR';r.onresult=e=>{q.value=e.results[0][0].transcript.toUpperCase().replace(/GUION/g,'-');show()};r.start()};show();
</script></body></html>
